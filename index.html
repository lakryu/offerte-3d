<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D-Druck Offerte</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --bg: #f6f5f2; --card: #fff; --text: #1d1d1f; --muted: #6b6b70;
    --line: #e2e0db; --accent: #2f6f5e; --accent-text: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161617; --card: #222224; --text: #ececee; --muted: #9a9aa0;
      --line: #36363a; --accent: #5bb39a; --accent-text: #0d1f1a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 18px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  input, textarea {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%;
  }
  textarea { resize: vertical; min-height: 64px; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .check { flex-direction: row; align-items: center; gap: 8px; font-size: 14px; color: var(--text); }
  .check input { width: auto; }

  .pos { display: grid; grid-template-columns: 1fr 56px 76px 76px 76px 76px 80px 32px; gap: 8px; align-items: end; margin-bottom: 8px; }
  .pos .sum { text-align: right; padding-bottom: 8px; font-variant-numeric: tabular-nums; }
  .pos-head { font-size: 12px; color: var(--muted); }
  .pos-head span:nth-child(7) { text-align: right; }
  @media (min-width: 601px) { main { max-width: 900px; } }
  .del { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; height: 36px; cursor: pointer; }
  .del:hover { color: #c0392b; border-color: #c0392b; }
  @media (max-width: 600px) {
    .pos { grid-template-columns: 1fr 1fr; }
    .pos .name { grid-column: 1 / -1; }
    .pos-head { display: none; }
  }

  button.primary, button.ghost {
    font: inherit; border-radius: 8px; padding: 9px 16px; cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border: none; font-weight: 600; }
  button.ghost { background: none; color: var(--accent); border: 1px dashed var(--accent); }

  .totals { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; font-variant-numeric: tabular-nums; }
  .totals .r { text-align: right; }
  .totals .big { font-size: 20px; font-weight: 700; padding-top: 6px; border-top: 1px solid var(--line); margin-top: 4px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>3D-Druck Offerte</h1>

  <section>
    <h2>Ansätze</h2>
    <div class="grid">
      <label>Vor-/Nachbereitung (CHF/h)<input id="rateHour" type="number" step="0.5" min="0" value="60"></label>
      <label>Material (Rp./g)<input id="rateGram" type="number" step="1" min="0" value="10"></label>
      <label>Maschinenzeit (CHF/h)<input id="rateMachine" type="number" step="0.5" min="0" value="2"></label>
      <label>Design (CHF/h)<input id="rateDesign" type="number" step="0.5" min="0" value="60"></label>
      <label>Pauschale / Einrichten (CHF)<input id="setup" type="number" step="1" min="0" value="0"></label>
      <label class="check"><input id="vat" type="checkbox"> inkl. MwSt 8.1 %</label>
    </div>
  </section>

  <section>
    <h2>Objekte</h2>
    <div class="pos pos-head"><span>Bezeichnung</span><span>Anzahl</span><span>Gramm / Stk</span><span>Std. Druck</span><span>Std. Vor/Nach</span><span>Std. Design</span><span>CHF</span><span></span></div>
    <div id="positions"></div>
    <button class="ghost" id="addPos" type="button">+ Objekt</button>
  </section>

  <section>
    <h2>Kunde &amp; Offerte</h2>
    <div class="grid">
      <label>Kunde (Name, Adresse)<textarea id="customer" placeholder="Max Muster&#10;Musterstrasse 1&#10;8000 Zürich"></textarea></label>
      <label>Bemerkung (optional)<textarea id="note" placeholder="z.B. Farbe, Material PLA, Lieferzeit ..."></textarea></label>
    </div>
    <div class="grid" style="margin-top:10px">
      <label>Offerte Nr.<input id="number"></label>
      <label>Datum<input id="date" type="date"></label>
      <label>Gültig (Tage)<input id="valid" type="number" min="1" value="30"></label>
    </div>
    <details style="margin-top:12px">
      <summary>Absender (wird gespeichert)</summary>
      <div class="grid" style="margin-top:10px">
        <label>Absender (Name, Adresse, Kontakt)<textarea id="sender" placeholder="Dein Name&#10;Strasse&#10;PLZ Ort&#10;mail@beispiel.ch"></textarea></label>
      </div>
    </details>
  </section>

  <section>
    <div class="totals" id="totals"></div>
    <div class="actions" style="margin-top:14px">
      <button class="primary" id="pdf" type="button">PDF erstellen</button>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const STORE = 'offerte3d';
const fmt = n => n.toLocaleString('de-CH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const round05 = n => Math.round(n * 20) / 20; // auf 5 Rappen

function load() {
  try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch { return {}; }
}
function save() {
  try {
    localStorage.setItem(STORE, JSON.stringify({
      rateHour: $('rateHour').value, rateGram: $('rateGram').value, rateDesign: $('rateDesign').value, rateMachine: $('rateMachine').value, setup: $('setup').value,
      vat: $('vat').checked, valid: $('valid').value, sender: $('sender').value,
      counter: state.counter,
    }));
  } catch {}
}

const state = { counter: 1 };

function addPosition(p = {}) {
  const row = document.createElement('div');
  row.className = 'pos';
  row.innerHTML = `
    <input class="name" placeholder="Objekt" value="${p.name || ''}">
    <input class="qty" type="number" min="1" step="1" value="${p.qty || 1}" title="Anzahl">
    <input class="gram" type="number" min="0" step="1" value="${p.gram || ''}" placeholder="g" title="Gramm pro Stück">
    <input class="machine" type="number" min="0" step="0.25" value="${p.machine || ''}" placeholder="h" title="Std. Druck (Maschinenzeit)">
    <input class="hours"type="number" min="0" step="0.25" value="${p.hours || ''}" placeholder="h" title="Std. Vor-/Nachbereitung">
    <input class="design" type="number" min="0" step="0.25" value="${p.design || ''}" placeholder="h" title="Std. Design">
    <div class="sum">0.00</div>
    <button class="del" type="button" title="Entfernen">×</button>`;
  row.querySelector('.del').onclick = () => { row.remove(); calc(); };
  row.querySelectorAll('input').forEach(i => i.oninput = calc);
  $('positions').appendChild(row);
  calc();
}

function num(el) { return parseFloat(el.value) || 0; }

function compute() {
  const rateHour = num($('rateHour'));
  const rateGram = num($('rateGram')) / 100; // Rp -> CHF
  const rateDesign = num($('rateDesign'));
  const rateMachine = num($('rateMachine'));
  const items = [...document.querySelectorAll('#positions .pos')].map(row => {
    const name = row.querySelector('.name').value.trim() || '3D-Modell';
    const qty = Math.max(1, Math.round(num(row.querySelector('.qty'))));
    const material = qty * num(row.querySelector('.gram')) * rateGram;
    const machine = num(row.querySelector('.machine')) * rateMachine;
    const work = num(row.querySelector('.hours')) * rateHour;
    const design = num(row.querySelector('.design')) * rateDesign;
    return { row, name, qty, material, machine, work, design, total: material + machine + work + design };
  });
  const setup = num($('setup'));
  const net = items.reduce((s, i) => s + i.total, 0) + setup;
  const vat = $('vat').checked ? net * 0.081 : 0;
  const total = round05(net + vat);
  return { items, setup, net, vat, total };
}

function calc() {
  const c = compute();
  c.items.forEach(i => i.row.querySelector('.sum').textContent = fmt(i.total));
  const rows = [
    ['Material', fmt(c.items.reduce((s, i) => s + i.material, 0))],
    ['Druck', fmt(c.items.reduce((s, i) => s + i.machine, 0))],
    ['Vor-/Nachbereitung', fmt(c.items.reduce((s, i) => s + i.work, 0))],
    ['Design', fmt(c.items.reduce((s, i) => s + i.design, 0))],
  ];
  if (c.setup) rows.push(['Pauschale', fmt(c.setup)]);
  if (c.vat) rows.push(['MwSt 8.1 %', fmt(c.vat)]);
  $('totals').innerHTML = rows.map(([a, b]) => `<span>${a}</span><span class="r">${b}</span>`).join('')
    + `<span class="big">Total CHF</span><span class="big r">${fmt(c.total)}</span>`;
  save();
}

function offerNumber() {
  const y = new Date().getFullYear();
  return `${y}-${String(state.counter).padStart(3, '0')}`;
}

function makePdf() {
  const { jsPDF } = window.jspdf;
  const c = compute();
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const L = 20, R = 190;
  let y = 20;

  // Absender
  doc.setFont('helvetica', 'normal').setFontSize(9).setTextColor(100);
  const sender = $('sender').value.trim().split('\n').filter(Boolean);
  sender.forEach((line, i) => doc.text(line, R, y + i * 4.2, { align: 'right' }));

  // Kunde
  doc.setFontSize(11).setTextColor(0);
  y = 50;
  $('customer').value.trim().split('\n').forEach((line, i) => doc.text(line, L, y + i * 5));

  // Titel
  y = 90;
  const dateVal = $('date').value ? new Date($('date').value) : new Date();
  const validUntil = new Date(dateVal); validUntil.setDate(validUntil.getDate() + (parseInt($('valid').value) || 30));
  const d = dt => dt.toLocaleDateString('de-CH');
  doc.setFont('helvetica', 'bold').setFontSize(18).text('Offerte', L, y);
  doc.setFont('helvetica', 'normal').setFontSize(10).setTextColor(90);
  doc.text(`Nr. ${$('number').value}`, L, y + 7);
  doc.text(`Datum: ${d(dateVal)}   ·   gültig bis ${d(validUntil)}`, L, y + 12);
  doc.setTextColor(0);

  // Tabelle
  y += 26;
  doc.setFont('helvetica', 'bold').setFontSize(9);
  doc.text('Position', L, y);
  doc.text('CHF', R, y, { align: 'right' });
  y += 2; doc.setDrawColor(180).line(L, y, R, y); y += 6;

  // Pro Objekt: Material, Vor-/Nachbereitung, Design (nur Beträge, keine Stunden)
  c.items.forEach(i => {
    const title = i.qty > 1 ? `${i.name} (${i.qty} Stk.)` : i.name;
    doc.setFont('helvetica', 'bold').setFontSize(10);
    const lines = doc.splitTextToSize(title, 140);
    doc.text(lines, L, y);
    y += lines.length * 5;
    doc.setFont('helvetica', 'normal');
    [['Material', i.material], ['Druck', i.machine], ['Vor-/Nachbereitung', i.work], ['Design', i.design]]
      .filter(([, v]) => v > 0)
      .forEach(([label, v]) => {
        doc.text(label, L + 4, y);
        doc.text(fmt(v), R, y, { align: 'right' });
        y += 5;
      });
    y += 3;
    if (y > 250) { doc.addPage(); y = 25; }
  });
  doc.setFont('helvetica', 'normal');
  if (c.setup) {
    doc.text('Pauschale / Einrichten', L, y);
    doc.text(fmt(c.setup), R, y, { align: 'right' });
    y += 7;
  }

  // Summen
  y += 1; doc.line(110, y, R, y); y += 6;
  const sumRow = (label, val, bold) => {
    doc.setFont('helvetica', bold ? 'bold' : 'normal').setFontSize(bold ? 12 : 10);
    doc.text(label, 110, y); doc.text(val, R, y, { align: 'right' }); y += bold ? 8 : 5.5;
  };
  if (c.vat) { sumRow('Zwischentotal', fmt(c.net)); sumRow('MwSt 8.1 %', fmt(c.vat)); }
  sumRow('Total CHF', fmt(c.total), true);

  // Bemerkung
  const note = $('note').value.trim();
  if (note) {
    y += 6;
    doc.setFont('helvetica', 'normal').setFontSize(10);
    doc.text(doc.splitTextToSize(note, R - L), L, y);
  }

  doc.save(`Offerte_${$('number').value || 'ohne-nr'}.pdf`);

  // Nächste Nummer vorbereiten
  state.counter++;
  $('number').value = offerNumber();
  save();
}

// Init
const s = load();
['rateHour', 'rateGram', 'rateDesign', 'rateMachine', 'setup', 'valid', 'sender'].forEach(k => { if (s[k] != null) $(k).value = s[k]; });
if (s.vat) $('vat').checked = true;
state.counter = s.counter || 1;
$('number').value = offerNumber();
$('date').valueAsDate = new Date();
['rateHour', 'rateGram', 'rateDesign', 'rateMachine', 'setup', 'vat', 'valid', 'sender'].forEach(k => $(k).addEventListener('input', calc));
$('addPos').onclick = () => addPosition();
$('pdf').onclick = makePdf;
addPosition();
</script>
</body>
</html>
